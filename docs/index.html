<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新轻小说 - LoloBun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --text: #f5f5f5;
            --text-secondary: #a1a1aa;
            --border: #27272a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .last-updated {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Search */
        .search-container {
            max-width: 600px;
            margin: -1rem auto 2rem;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .search-box {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-box::placeholder {
            color: var(--text-secondary);
        }

        /* Grid Layout - Responsive */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem 3rem;
        }

        .novels-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .novels-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1.25rem;
            }
        }

        @media (min-width: 1024px) {
            .novels-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 1.5rem;
            }
        }

        @media (min-width: 1280px) {
            .novels-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* Card */
        .novel-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .novel-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            background: var(--surface-hover);
        }

        .cover-wrapper {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .novel-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .novel-card:hover .novel-cover {
            transform: scale(1.05);
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            opacity: 0.3;
        }

        .type-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            color: white;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-content {
            padding: 1rem;
        }

        .novel-title {
            font-size: 0.9375rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }

        .novel-intro {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
        }

        .tag {
            padding: 3px 10px;
            font-size: 0.6875rem;
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            white-space: nowrap;
        }

        /* Loading & Error */
        .loading, .error, .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .error {
            color: #ef4444;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Stats */
        .stats {
            text-align: center;
            padding: 1rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>最新轻小说</h1>
        <p class="last-updated" id="lastUpdated">加载中...</p>
    </header>

    <div class="search-container">
        <input type="search" class="search-box" id="searchInput" placeholder="搜索小说名称、类型或标签...">
    </div>

    <main class="container">
        <div id="novelsGrid" class="novels-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>正在加载数据...</p>
            </div>
        </div>
        <div class="stats" id="stats"></div>
    </main>

    <script>
        const BASE_URL = 'https://osrs.sfacg.com';
        const COVER_BASE_URL = `${BASE_URL}/web/novel/images/NovelCover/Big/`;

        let allNovels = [];

        async function loadNovels() {
            try {
                const response = await fetch('data/novels.json');
                if (!response.ok) throw new Error('Failed to load data');
                allNovels = await response.json();
                displayNovels(allNovels);
                updateStats(allNovels);
                updateLastUpdated();
            } catch (error) {
                document.getElementById('novelsGrid').innerHTML = `
                    <div class="error">
                        <p>加载失败: ${error.message}</p>
                        <p>请稍后刷新重试</p>
                    </div>
                `;
            }
        }

        function getCoverUrl(coverPath) {
            if (!coverPath || coverPath === 'defaultNew.jpg' || coverPath.includes('default')) {
                return null;
            }
            return COVER_BASE_URL + coverPath;
        }

        function displayNovels(novels) {
            const grid = document.getElementById('novelsGrid');

            if (novels.length === 0) {
                grid.innerHTML = '<div class="empty">没有找到匹配的小说</div>';
                return;
            }

            grid.innerHTML = novels.map(novel => {
                const coverUrl = getCoverUrl(novel.NovelCover);
                const coverHtml = coverUrl
                    ? `<img class="novel-cover" src="${coverUrl}" alt="${novel.NovelName}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'cover-placeholder\\'>📚</div>'">`
                    : `<div class="cover-placeholder">📚</div>`;

                return `
                    <article class="novel-card">
                        <div class="cover-wrapper">
                            ${coverHtml}
                            <span class="type-badge">${novel.TypeName}</span>
                        </div>
                        <div class="card-content">
                            <h3 class="novel-title">${novel.NovelName}</h3>
                            <p class="novel-intro">${novel.Intro || '暂无简介'}</p>
                            <div class="tags">
                                ${novel.Tags.slice(0, 4).map(tag => `<span class="tag">${tag.Value}</span>`).join('')}
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function updateStats(novels) {
            document.getElementById('stats').textContent = `共 ${novels.length} 本小说`;
        }

        function updateLastUpdated() {
            const now = new Date();
            document.getElementById('lastUpdated').textContent =
                `最后更新: ${now.toLocaleString('zh-CN')}`;
        }

        // Search with debounce
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) {
                    displayNovels(allNovels);
                    updateStats(allNovels);
                    return;
                }
                const filtered = allNovels.filter(n =>
                    n.NovelName.toLowerCase().includes(query) ||
                    n.TypeName.toLowerCase().includes(query) ||
                    n.Tags.some(t => t.Value.toLowerCase().includes(query))
                );
                displayNovels(filtered);
                updateStats(filtered);
            }, 300);
        });

        loadNovels();
    </script>
</body>
</html>
